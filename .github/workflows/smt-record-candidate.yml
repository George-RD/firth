name: SMT record candidate validation

on:
  push:
    branches: [codex/smt-record-promotion-validation]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Verify isolated baseline
        run: |
          test "$GITHUB_REF" = refs/heads/codex/smt-record-promotion-validation
          test "$(git rev-parse HEAD^)" = faf2ba7fd8075586337a8af799dbeccb452d2410
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/smt-record-candidate.yml
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
      - name: Decode checksum-bound review patches
        run: |
          python3 - <<'PY'
          import base64, hashlib, pathlib, zlib
          patches = {
          'regressions': ('f9cc8e27579905d814c8691acb4ec0b8bf5776c8333f5d5c5e24c38097e541ea', ''),
          'implementation': ('302427911e4777e149c2a548588e3c3f0e493a500a962427805fbf564b534ae8', '')}
          for name, (expected, encoded) in patches.items():
              patch = zlib.decompress(base64.b64decode(encoded, validate=True))
              assert hashlib.sha256(patch).hexdigest() == expected, name
              pathlib.Path('/tmp/smt-' + name + '.patch').write_bytes(patch)
          PY
      - name: Build regressions against unchanged implementation
        run: |
          git apply --check /tmp/smt-regressions.patch
          git apply /tmp/smt-regressions.patch
          lake build 2>&1 | tee /tmp/smt-before-build.log
      - name: Require the two original admission failures
        run: |
          set +e
          lake exe firthSmtSolverTest > /tmp/smt-before-constructor.log 2>&1
          constructor=$?
          lake exe firthRecordIntegrityTest > /tmp/smt-before-rerun.log 2>&1
          rerun=$?
          set -e
          test "$constructor" -ne 0
          test "$rerun" -ne 0
          grep -F 'fabricated checked-unsat produced a record' /tmp/smt-before-constructor.log
          grep -F 'a caller-selected rerun marker for another word: no record may be exposed' /tmp/smt-before-rerun.log
      - name: Apply implementation and build governed modules
        run: |
          git apply --check /tmp/smt-implementation.patch
          git apply /tmp/smt-implementation.patch
          lake build 2>&1 | tee /tmp/smt-after-build.log
          python3 tools/loop/check_zero_admit.py
          python3 tools/loop/update_smt_proof_bindings.py --check
          python3 tools/loop/update_proof_manifest.py
          git diff -- src/elaborator/refinement-proof-module.sha256 | tee /tmp/smt-compiled-bindings.diff
          python3 tools/loop/update_proof_manifest.py --check
          lake test 2>&1 | tee /tmp/smt-after-tests.log
      - name: Publish source candidate only to isolated branch
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess
          expected = {'src/smt/Firth/SmtBoundary.lean', 'src/smt/Firth/SmtSolver.lean', 'src/smt/FirthSmtSolverTest.lean', 'src/elaborator/Firth/Refinement.lean', 'src/elaborator/FirthRefinementTest.lean', 'src/elaborator/FirthRecordIntegrityTest.lean', 'src/elaborator/refinement-proof-module.sha256'}
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert actual == expected, (actual, expected)
          subprocess.run(['git', 'add', '--', *sorted(expected)], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached > /tmp/smt-candidate.diff
          git commit -m 'fix: own SMT record promotion and recheck rerun bindings'
          git push origin HEAD:refs/heads/codex/smt-record-promotion-validation
          git rev-parse HEAD HEAD^{tree} | tee /tmp/smt-candidate-identity.log
      - name: Retain failing-before and passing-after evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: smt-record-promotion-evidence
          path: /tmp/smt-*
          retention-days: 14
          if-no-files-found: error
