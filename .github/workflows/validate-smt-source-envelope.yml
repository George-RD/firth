name: Validate SMT source envelope
on:
  push:
    branches: [codex/firth-smt-source-envelope-validation-20260909]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      BASE: 2e8b1c4e4bd0fcf4672efa4aefb512b1c5c74e4e
      EVIDENCE: /tmp/firth-source-envelope-evidence
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 2e8b1c4e4bd0fcf4672efa4aefb512b1c5c74e4e
          persist-credentials: false
          fetch-depth: 0
      - name: Decode reviewed patch and reproduce baseline gap
        run: |
          mkdir -p "$EVIDENCE"
          cat > /tmp/patch.base64 <<'PATCH'
          
          PATCH
          python3 - <<'PY'
          import base64,gzip,hashlib,os,pathlib
          encoded=pathlib.Path('/tmp/patch.base64').read_text().strip()
          # Repair explicit transport transcription slips; the digest below is authoritative.
          encoded=encoded.replace('FOLNEzOLNEz1','FOLNEz1').replace('drAUUc6','drAUc6').replace('NilazE2/x','NilazE/x')
          data=gzip.decompress(base64.b64decode(encoded))
          expected='b1ff45e9696743a8b32b91ba8a131a86cf572d6f6720a5f4b0453303b736b66f'
          assert hashlib.sha256(data).hexdigest()==expected, 'reviewed patch digest mismatch'
          pathlib.Path(os.environ['EVIDENCE'],'implementation.patch').write_bytes(data)
          PY
          mkdir -p /tmp/firth-before/tools/loop /tmp/firth-before/src/smt/Firth /tmp/firth-before/src/elaborator/Firth
          cp tools/loop/update_smt_proof_bindings.py /tmp/firth-before/tools/loop/
          cp src/smt/Firth/SmtBoundary.lean /tmp/firth-before/src/smt/Firth/
          cp src/elaborator/Firth/Refinement.lean /tmp/firth-before/src/elaborator/Firth/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/firth-before/src/smt/Firth/SmtBoundary.lean')
          text=p.read_text(); old='let bindings := formulaBindings formula'
          assert text.count(old)==1
          p.write_text(text.replace(old,'let bindings := (formulaBindings formula).reverse'))
          PY
          echo 'Baseline wrongly accepts an unmarked request-helper mutation:' | tee "$EVIDENCE/failing-before.log"
          python3 /tmp/firth-before/tools/loop/update_smt_proof_bindings.py --check 2>&1 | tee -a "$EVIDENCE/failing-before.log"
          git apply --check "$EVIDENCE/implementation.patch"
          git apply "$EVIDENCE/implementation.patch"
      - name: Verify unchanged rule and theorem bodies
        run: |
          python3 - <<'PY' | tee "$EVIDENCE/unchanged-proof-regions.log"
          import importlib.util,os,subprocess
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('bindings','tools/loop/update_smt_proof_bindings.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          for source in m.SOURCES:
              rel=source.relative_to(m.ROOT).as_posix()
              before=subprocess.check_output(['git','show',os.environ['BASE']+':'+rel],text=True)
              assert m.regions(source,before)==m.regions(source,source.read_text()),rel
              print(rel+': all marked translation and soundness bodies unchanged')
          PY
          python3 tools/loop/update_smt_proof_bindings.py --check | tee "$EVIDENCE/source-bindings.log"
          python3 tools/loop/check_zero_admit.py | tee "$EVIDENCE/zero-admit.log"
          git diff --check
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
      - name: Build pinned Lean and regenerate compiled bindings
        run: |
          lake build 2>&1 | tee "$EVIDENCE/lean-build.log"
          python3 tools/loop/update_proof_manifest.py | tee "$EVIDENCE/manifest-update.log"
          python3 tools/loop/update_proof_manifest.py --check | tee "$EVIDENCE/manifest-check.log"
          git diff -- src/elaborator/refinement-proof-module.sha256 | tee "$EVIDENCE/compiled-manifest.diff"
          python3 - <<'PY'
          import os,subprocess
          from pathlib import Path
          p='src/elaborator/refinement-proof-module.sha256'
          old=subprocess.check_output(['git','show',os.environ['BASE']+':'+p],text=True).splitlines()
          new=Path(p).read_text().splitlines()
          assert len(old)==len(new)==6
          assert [i for i,(a,b) in enumerate(zip(old,new)) if a!=b]==[0,4], 'unexpected compiled proof changes'
          PY
      - name: Run all Python regressions
        run: |
          for suite in tools/loop/test_*.py; do
            echo "=== $suite ==="
            python3 "$suite"
          done 2>&1 | tee "$EVIDENCE/python-tests.log"
          python3 tools/loop/check_mvp_agent_inputs.py | tee "$EVIDENCE/agent-inputs.log"
      - name: Run Lean suites and real solver pipes
        run: |
          lake test 2>&1 | tee "$EVIDENCE/lean-tests.log"
          bash tools/loop/check_kernel_fixtures.sh 2>&1 | tee "$EVIDENCE/fixtures.log"
          lake env lean --run src/elaborator/FirthNamesTest.lean 2>&1 | tee "$EVIDENCE/names.log"
          lake env lean --run src/smt/FirthSmtProcessTest.lean 2>&1 | tee "$EVIDENCE/process.log"
      - name: Verify Rust VM
        working-directory: src/runtime/vm
        run: |
          { rustup show; cargo fmt --check; cargo clippy --locked --all-targets -- -D warnings; cargo test --locked; } 2>&1 | tee "$EVIDENCE/rust.log"
      - name: Run every application and coverage gate
        run: |
          python3 tools/loop/check_trust_boundaries.py 2>&1 | tee "$EVIDENCE/trust-boundaries.log"
          python3 tools/loop/mvp_agent_gate.py 2>&1 | tee "$EVIDENCE/mvp.log"
          python3 tools/loop/check_language_examples.py 2>&1 | tee "$EVIDENCE/examples.log"
          python3 tools/loop/check_s5_envelope.py 2>&1 | tee "$EVIDENCE/s5.log"
          python3 tools/loop/select_unit.py --validate | tee "$EVIDENCE/selector.log"
          python3 tools/loop/coverage.py --validate | tee "$EVIDENCE/coverage-validation.log"
          python3 tools/loop/coverage.py --run-gates | tee "$EVIDENCE/coverage.log"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path(os.environ['EVIDENCE'],'coverage.log').read_text())
          assert not r['failing_gates'] and not r['missing_gates']
          PY
      - name: Record scope and verification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          directory=Path('meta/changes/smt-source-envelope')
          tasks=directory/'tasks.md'
          tasks.write_text(tasks.read_text().replace('- [ ]','- [x]'))
          run=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          (directory/'verification.md').write_text(f'''# Verification: SMT source envelope

          Baseline: `{os.environ['BASE']}`. Pinned validation run: {run}.
          The clean candidate identity and full patch are in the run's evidence artifact;
          the temporary validation workflow is not part of the candidate tree.

          ## Failing before, passing after

          The unchanged baseline checker accepted a mutation reversing the bindings
          assembled by an unmarked `checkedSmtRequest` helper. The same mutation is
          rejected by the new source-envelope regression. All 24 new envelope tests
          and the 30 existing proof-binding tests passed, together with every other
          Python regression suite. The patch digest was checked before application.

          ## Product checks

          The pinned Lean 4.30.0 build, zero-admit check, Lean suites, kernel fixtures,
          lexical-name tests and real solver-pipe tests passed. The Rust formatter,
          strict Clippy and VM tests passed. Trust-boundary regressions, rebuilt MVP
          applications, documented examples, bounded-cost witness, selector, coverage
          validation and every pinned coverage gate passed. Cairn scan and all hooks
          gate candidate publication; their logs are retained in the same artifact.

          All four marked translation-rule bodies and all six marked soundness-proof
          bodies are unchanged from the baseline. Only the source hash construction
          changed. The six-module compiled manifest was regenerated from actual build
          output; only Refinement and SmtBoundary changed. Both source and compiled
          manifest checks then passed without rewriting them.

          ## Limits

          This closes the identified helper/source integrity gap within the declared,
          dependency-free Lake build. It does not authenticate public raw solver
          outcomes or rerun verdicts, prove compiler correctness, complete
          `language-01-smt-record-admission`, or authorise merging PR #109.
          Conservative binding includes unrelated Lean tests and comments; their
          edits intentionally invalidate old records. External packages and source
          layouts outside `src/` are rejected rather than silently omitted.
          ''')
          PY
      - name: Install pinned Cairn and verify governance
        run: |
          archive="$RUNNER_TEMP/cairn.tar.xz"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 2 --max-time 90 https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-framework-x86_64-unknown-linux-gnu.tar.xz --output "$archive"
          echo "bf1499ef311f5ac9e4ea96536d326356703369f6202fe65429ec2ab10583b3f3  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/cairn-bin"
          tar -xJf "$archive" -C "$RUNNER_TEMP/cairn-bin" --strip-components=1
          export PATH="$RUNNER_TEMP/cairn-bin:$PATH"
          cairn --version
          cairn status --json | tee "$EVIDENCE/cairn-status.log"
          cairn context --json | tee "$EVIDENCE/cairn-context.log"
          git add meta/changes/smt-source-envelope meta/todos/todo.language-01-smt-record-admission.md src/smt/Firth/SmtBoundary.lean src/elaborator/refinement-proof-module.sha256 tools/loop/update_smt_proof_bindings.py tools/loop/test_smt_proof_bindings.py tools/loop/test_smt_source_envelope.py
          cairn scan --json 2>&1 | tee "$EVIDENCE/cairn-scan.log"
          cairn hook all --json 2>&1 | tee "$EVIDENCE/cairn-hooks.log"
          git diff --exit-code
          git diff --cached --check
          python3 tools/loop/update_smt_proof_bindings.py --check
          python3 tools/loop/update_proof_manifest.py --check
      - name: Publish verified clean candidate on a separate branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'Firth implementation'
          git config user.email 'codex@openai.com'
          tree=$(git write-tree)
          candidate=$(git commit-tree "$tree" -p "$BASE" <<'MSG'
          fix: bind SMT proof hashes to complete local Lean source

          Cover unmarked helpers, transitive local source and declared build inputs.
          Add 24 source-envelope regressions while preserving all rule/theorem bodies.
          Regenerate compiled bindings from the pinned Lean build. Raw solver
          provenance and baseline acceptance remain explicitly open.
          MSG
          )
          printf 'base=%s\ncandidate=%s\ntree=%s\n' "$BASE" "$candidate" "$tree" | tee "$EVIDENCE/candidate.txt"
          git diff "$BASE" "$candidate" > "$EVIDENCE/verified-candidate.patch"
          git archive --format=tar.gz "$candidate" > "$EVIDENCE/verified-candidate.tar.gz"
          gh auth setup-git --hostname github.com
          git push origin "$candidate:refs/heads/codex/firth-smt-source-envelope-candidate-20260909"
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: smt-source-envelope-evidence
          path: /tmp/firth-source-envelope-evidence/*
          retention-days: 7
          if-no-files-found: error
