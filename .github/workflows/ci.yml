name: Firth CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: firth-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Archive the exact tracked source used by this run
        run: git archive --format=tar.gz --output=/tmp/firth-source.tar.gz HEAD
      - name: Retain source snapshot for reproducible review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-snapshot
          path: /tmp/firth-source.tar.gz
          retention-days: 7
          if-no-files-found: error
      - name: Run control-plane regression suites
        run: |
          python3 --version
          for suite in tools/loop/test_*.py; do
            python3 "$suite"
          done
      - name: Validate the agent input schema
        run: python3 tools/loop/check_mvp_agent_inputs.py
      - name: Check changed-line whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi

  language:
    name: Lean, Rust and source-to-execution gates
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
      - name: Build Lean targets
        run: lake build 2>&1 | tee /tmp/language-build.log
      - name: Verify governed proof bindings without rewriting them
        run: |
          python3 tools/loop/check_zero_admit.py
          python3 tools/loop/update_smt_proof_bindings.py --check
          python3 tools/loop/update_proof_manifest.py --check
      - name: Run Lean suites
        run: lake test 2>&1 | tee /tmp/language-lean-tests.log
      - name: Verify reference kernel fixtures
        run: bash tools/loop/check_kernel_fixtures.sh 2>&1 | tee /tmp/language-fixtures.log
      - name: Test canonical names and lexical imports
        run: lake env lean --run src/elaborator/FirthNamesTest.lean 2>&1 | tee /tmp/language-names.log
      - name: Test real solver pipes
        run: lake env lean --run src/smt/FirthSmtProcessTest.lean 2>&1 | tee /tmp/language-process.log
      - name: Verify Rust VM
        working-directory: src/runtime/vm
        run: |
          rustup show
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Reject unchecked claims and malformed adapter input
        run: python3 tools/loop/check_trust_boundaries.py 2>&1 | tee /tmp/language-trust.log
      - name: Rebuild and compare MVP applications
        run: python3 tools/loop/mvp_agent_gate.py 2>&1 | tee /tmp/language-mvp.log
      - name: Execute documented multiword programs and failure cases
        run: python3 tools/loop/check_language_examples.py 2>&1 | tee /tmp/language-examples.log
      - name: Execute the seeded differential source campaign
        run: python3 src/diffharness/harness.py run --seed 0 --seed 1 --seed 20260909 --cases 24 --artifacts /tmp/firth-differential 2>&1 | tee /tmp/language-differential.log
      - name: Check bounded cost witness
        run: python3 tools/loop/check_s5_envelope.py 2>&1 | tee /tmp/language-s5.log
      - name: Validate active coverage and execute every pinned gate
        run: |
          python3 tools/loop/select_unit.py --validate
          python3 tools/loop/coverage.py --validate
          python3 tools/loop/coverage.py --run-gates | tee /tmp/language-coverage.log
          python3 -c 'import json,sys; r=json.load(open("/tmp/language-coverage.log")); sys.exit(bool(r["failing_gates"] or r["missing_gates"]))'
      - name: Retain execution diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: language-diagnostics
          path: |
            /tmp/language-*.log
            /tmp/firth-differential
          retention-days: 7
          if-no-files-found: ignore

  governance:
    name: Cairn architecture and governance gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-pinned Cairn 0.9.0
        run: |
          archive="$RUNNER_TEMP/cairn.tar.xz"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 2 --max-time 90 \
            https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-framework-x86_64-unknown-linux-gnu.tar.xz \
            --output "$archive"
          echo "bf1499ef311f5ac9e4ea96536d326356703369f6202fe65429ec2ab10583b3f3  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/cairn-bin"
          tar -xJf "$archive" -C "$RUNNER_TEMP/cairn-bin" --strip-components=1
          "$RUNNER_TEMP/cairn-bin/cairn" --version
          echo "$RUNNER_TEMP/cairn-bin" >> "$GITHUB_PATH"
      - name: Scan declared architecture
        run: cairn scan --json 2>&1 | tee /tmp/governance-scan.log
      - name: Run every governance hook
        run: cairn hook all --json 2>&1 | tee /tmp/governance-hooks.log
      - name: Ensure checks did not rewrite tracked evidence
        run: git diff --exit-code
      - name: Retain governance diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: governance-diagnostics
          path: /tmp/governance-*.log
          retention-days: 7
          if-no-files-found: ignore
