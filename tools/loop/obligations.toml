# PRD obligations matrix for the Firth autonomous loop.
# Each [obligation.<id>] row maps one PRD section-4 scope bullet, requirement
# (R1-R17), or success criterion (S1-S7) to the blueprint node responsible for
# it and the todo slugs that discharge it. satisfied_by = [] means the
# obligation is ungenerated: no todo exists yet. Enabling research or design
# work is intentionally not sufficient for a product obligation.
#
# milestone = "mvp" (default) or "post-mvp". The [completion] table names the
# active completion profile: "mvp" ends the loop when every mvp-tagged row is
# discharged; "full" restores whole-matrix completion. Post-mvp rows stay in
# the matrix as the visible roadmap: they are never chosen as next_obligation
# while the mvp profile is active and do not hold loop_exhausted_valid false.
# Milestone tags and the active profile are goal layer (dec.loop-autonomy
# clause 2a; boundary defined by dec.mvp-completion): only a maintainer-
# authored decision landed outside the loop may change them.

[completion]
profile = "mvp"

[obligation.scope-language-kernel-calculus]
node = "firth.language.kernel"
source = "PRD 4.1 kernel calculus"
satisfied_by = ["kernel-spec-freeze", "kernel-metatheory"]

