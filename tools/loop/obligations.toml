# MVP acceptance gate (dec.mvp-completion clause 4, as amended by
# dec.mvp-gate-provenance): an agent-facing language guide plus basic
# example applications authored by a code model given only the guide and
# the agent interface, each elaborated, checked, compiled, run on the VM
# with interpreter agreement. The pinned gate script must verify the
# provenance manifest at tools/loop/mvp_agent_manifest.toml (guide,
# interface, transcript, and app hashes) and fail without it, then rebuild
# and run each app in a scratch workspace. Discharged by done todos like
# every row, with one extra machine check: coverage.py holds
# loop_exhausted_valid false while the pinned gate is absent, and executes
# it under --run-gates, so prose can never stand in for the executable gate.
[obligation.mvp-agent-authoring]
node = "firth.toolchain.agent"
source = "dec.mvp-gate-provenance (MVP reading of PRD S5/S7 per dec.mvp-completion clause 4)"
gate = "tools/loop/mvp_agent_gate.py"
satisfied_by = ["mvp-agent-authoring"]

# Maintainer-authorised acceptance strengthening; dec.usable-language-milestones.
# Future implementation gates must be pinned before their task is marked done.
[obligation.usable-language-baseline]
node = "firth.governance.loop"
source = "dec.usable-language-milestones M0 (PRD G1-G8)"
gate = "tools/loop/check_trust_boundaries.py"
satisfied_by = ["language-00-boundary-regressions", "language-01-smt-record-admission", "language-02-compiler-evidence", "language-03-runtime-conformance", "language-04-differential-execution", "language-05-baseline-acceptance"]

[obligation.usable-inventory-component]
node = "firth.toolchain.agent"
source = "dec.usable-language-milestones M1 (PRD G9/S5)"
satisfied_by = ["language-06-source-refinement-execution", "language-10-inventory-contract", "language-11-arithmetic-comparison", "language-12-data-and-modules", "language-13-inventory-component"]

[obligation.agent-maintained-component]
node = "firth.toolchain.agent"
source = "dec.usable-language-milestones M2 (bounded PRD G8/S7 pilot)"
satisfied_by = ["language-20-agent-workflow", "language-21-docs-only-change-trial"]

