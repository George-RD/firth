manifest_version = 1
protocol_version = "1.0"
language_version = "0.1"
role = "mvp-agent-input-and-provenance"
guide_path = "docs/firth-agent-guide.md"
interface_root = "src/agent/Firth/Agent"
gate_path = "tools/loop/mvp_agent_gate.py"

# The model-facing input is the guide plus these checked-in interface files.
# The gate separately validates this manifest's Gamma and adapter contracts.
[inputs]
model_only = true
guide_path = "docs/firth-agent-guide.md"
guide_sha256 = "954a84a992fe2b48b480b092b140534941a396f2bfe110acf8cbaf2a3a7cfc35"
interface_paths = [
  "src/agent/Firth/Agent/DiagnosticEnvelope.lean",
  "src/agent/Firth/Agent/Validation.lean",
  "src/agent/Firth/Agent/ElaboratorDiagnostics.lean",
]

[[inputs.interface]]
path = "src/agent/Firth/Agent/DiagnosticEnvelope.lean"
sha256 = "e61ee6d9912a2c74f1b9a149c5be268499e5d7d7c56546de617758bdb6386bd3"
role = "envelope-types-and-canonical-encoding"

[[inputs.interface]]
path = "src/agent/Firth/Agent/Validation.lean"
sha256 = "4e434eeee5f151d1dd42ccc78511fc06a9a7befebfd954b95f5334110326c2da"
role = "envelope-validation"

[[inputs.interface]]
path = "src/agent/Firth/Agent/ElaboratorDiagnostics.lean"
sha256 = "b04bea62ddcd31d992746cc7f647e131d32be44689ed4b8c8cd48247ee48f4e1"
role = "elaborator-to-envelope-adapters"

[gamma]
version = "0.7"
portable = true
primitives = ["+", "-", "*", "<", "=", "div", "mod", "and", "or", "not", "seq-int.empty", "seq-int.len", "seq-int.at", "seq-int.push", "seq-int.set", "seq-bool.empty", "seq-bool.len", "seq-bool.at", "seq-bool.push", "seq-bool.set", "send"]
values = ["Int", "Bool", "Seq Int", "Seq Bool", "Handle", "Bytes", "World"]
predicates = ["positive", "nonzero", "is-open"]

[gamma.primitive."+"]
effect = "Int^many Int^many -- Int^many"
transition = "deterministic-integer-addition"
observation = "pure"

[gamma.primitive."-"]
effect = "Int^many Int^many -- Int^many"
transition = "deterministic-integer-subtraction"
observation = "pure"

[gamma.primitive."*"]
effect = "Int^many Int^many -- Int^many"
transition = "deterministic-integer-multiplication"
observation = "pure"

[gamma.primitive."<"]
effect = "Int^many Int^many -- Bool^many"
transition = "deterministic-integer-less-than"
observation = "pure"

[gamma.primitive."="]
effect = "Int^many Int^many -- Bool^many"
transition = "deterministic-integer-equality"
observation = "pure"

[gamma.primitive."div"]
effect = "Int^many Int^many -- Int^many"
transition = "deterministic-euclidean-division-faulting-on-zero-divisor"
observation = "pure"

[gamma.primitive."mod"]
effect = "Int^many Int^many -- Int^many"
transition = "deterministic-euclidean-remainder-faulting-on-zero-divisor"
observation = "pure"

[gamma.primitive."and"]
effect = "Bool^many Bool^many -- Bool^many"
transition = "deterministic-boolean-and"
observation = "pure"

[gamma.primitive."or"]
effect = "Bool^many Bool^many -- Bool^many"
transition = "deterministic-boolean-or"
observation = "pure"

[gamma.primitive."not"]
effect = "Bool^many -- Bool^many"
transition = "deterministic-boolean-not"
observation = "pure"

[gamma.primitive."seq-int.empty"]
effect = "-- Seq Int^many"
transition = "deterministic-empty-sequence"
observation = "pure"

[gamma.primitive."seq-int.len"]
effect = "Seq Int^many -- Int^many"
transition = "deterministic-sequence-length"
observation = "pure"

[gamma.primitive."seq-int.at"]
effect = "Seq Int^many Int^many -- Int^many"
transition = "deterministic-sequence-index-faulting-out-of-range"
observation = "pure"

[gamma.primitive."seq-int.push"]
effect = "Seq Int^many Int^many -- Seq Int^many"
transition = "deterministic-sequence-append"
observation = "pure"

[gamma.primitive."seq-int.set"]
effect = "Seq Int^many Int^many Int^many -- Seq Int^many"
transition = "deterministic-sequence-replace-faulting-outside-bounds"
observation = "pure"

[gamma.primitive."seq-bool.empty"]
effect = "-- Seq Bool^many"
transition = "deterministic-empty-sequence"
observation = "pure"

[gamma.primitive."seq-bool.len"]
effect = "Seq Bool^many -- Int^many"
transition = "deterministic-sequence-length"
observation = "pure"

[gamma.primitive."seq-bool.at"]
effect = "Seq Bool^many Int^many -- Bool^many"
transition = "deterministic-sequence-index-faulting-out-of-range"
observation = "pure"

[gamma.primitive."seq-bool.push"]
effect = "Seq Bool^many Bool^many -- Seq Bool^many"
transition = "deterministic-sequence-append"
observation = "pure"

[gamma.primitive."seq-bool.set"]
effect = "Seq Bool^many Int^many Bool^many -- Seq Bool^many"
transition = "deterministic-sequence-replace-faulting-outside-bounds"
observation = "pure"

[gamma.primitive.send]
effect = "World^linear Handle^linear Bytes^linear -- World^linear"
transition = "deterministic-world-send"
observation = "world-threaded"

[gamma.predicate.positive]
effect = "Int^many -- Bool^many"
purity = "pure"
totality = "required"

[gamma.predicate.nonzero]
effect = "Int^many -- Bool^many"
purity = "pure"
totality = "required"

[gamma.predicate."is-open"]
effect = "Handle^many -- Bool^many"
purity = "pure"
totality = "required"

[agent_protocol]
schema_version = "1.0"
payload_kinds = [
  "diagnostic",
  "typed_hole",
  "signature_search_request",
  "signature_search_response",
]
diagnostic_code_namespaces = [
  "type",
  "linearity",
  "refinement",
  "elaboration",
  "syntax",
  "name",
  "search",
  "protocol",
]

# These versioned adapters are exercised by the executable gate.
# The source runner uses the same boundaries; gate-required means the gate
# must validate them, not that their implementations are absent.
[schema."firth.source.v1"]
version = "1.0"
encoding = "utf-8"
fields = ["request_id:string", "source_path:string", "source_text:string", "language_version:string", "gamma_version:string"]

[schema."firth.elaboration.v1"]
version = "1.0"
encoding = "json"
fields = ["request_id:string", "status:success|failure", "checked_words:array", "erased_word_types:array", "kernel_programs:array", "warnings:array", "diagnostics:array"]

[schema."firth.checked-kernel.v1"]
version = "1.0"
encoding = "json"
fields = ["request_id:string", "entry:string (required for multiword requests)", "checked_words:array", "erased_word_types:array", "gamma_version:string", "target_version:string"]

[schema."firth.target-program.v1"]
version = "1.0"
encoding = "json"
fields = ["request_id:string", "status:success|failure", "target_program:object", "word_digests:object", "debug_locations:array", "compile_error:object|null"]

[schema."firth.reference-execution.v1"]
version = "1.0"
encoding = "json"
fields = ["request_id:string", "checked_kernel:object", "initial_stack:array", "dictionary:object", "gamma_version:string", "fuel:nonnegative-integer"]

[schema."firth.vm-execution.v1"]
version = "1.0"
encoding = "json"
fields = ["request_id:string", "target_program:object", "initial_stack:array", "image:object", "gamma_version:string", "fuel:nonnegative-integer"]

[schema."firth.observation.v1"]
version = "1.0"
encoding = "json"
fields = ["request_id:string", "status:success|trap", "stack:array", "trace:array", "cost:object", "trap:string|null", "world_observation:object|null"]

[entry_point.elaborate]
version = "0.1"
kind = "source-to-checked-kernel"
availability = "gate-required"
adapter = "firth.elaborate.v1"
transport = "structured-json"
request_schema = "firth.source.v1"
response_schema = "firth.elaboration.v1"

[entry_point.elaborate.request]
required = ["request_id", "source_path", "source_text", "language_version", "gamma_version"]
source_encoding = "utf-8"

[entry_point.elaborate.response]
required = ["request_id", "status"]
success = ["checked_words", "erased_word_types", "kernel_programs", "warnings"]
failure = ["diagnostics"]

[entry_point.compile]
version = "0.1"
kind = "checked-kernel-to-target"
availability = "gate-required"
adapter = "firth.compile.v1"
transport = "structured-json"
request_schema = "firth.checked-kernel.v1"
response_schema = "firth.target-program.v1"

[entry_point.compile.request]
optional = ["entry"]
entry_rule = "source word name; required for multiple checked words; never inferred from definition order"
required = ["request_id", "checked_words", "erased_word_types", "gamma_version", "target_version"]

[entry_point.compile.response]
required = ["request_id", "status"]
success = ["target_program", "word_digests", "debug_locations"]
failure = ["compile_error"]

[entry_point.reference_run]
version = "0.1"
kind = "checked-kernel-execution"
availability = "gate-required"
adapter = "firth.reference-run.v1"
transport = "structured-json"
request_schema = "firth.reference-execution.v1"
response_schema = "firth.observation.v1"

[entry_point.reference_run.request]
required = ["request_id", "checked_kernel", "initial_stack", "dictionary", "gamma_version", "fuel"]

[entry_point.reference_run.response]
required = ["request_id", "status", "stack", "trace", "cost", "trap", "world_observation"]

[entry_point.vm_run]
version = "0.1"
kind = "target-execution"
availability = "gate-required"
adapter = "firth.vm-run.v1"
transport = "structured-json"
request_schema = "firth.vm-execution.v1"
response_schema = "firth.observation.v1"

[entry_point.vm_run.request]
required = ["request_id", "target_program", "initial_stack", "image", "gamma_version", "fuel"]

[entry_point.vm_run.response]
required = ["request_id", "status", "stack", "trace", "cost", "trap", "world_observation"]
# VM-only members after the shared firth.observation.v1 field list: residual
# frames, the trap subcode and the firth.vm-verification.v1 admission label.
extensions = ["frames", "trap_subcode", "verification"]

[comparison]
terminal_status = true
bottom_to_top_stack = true
trap_classification = true
bounded_trace = true
cost_report = true
world_observation = true
fuel_exhaustion = "bounded-fuel-inconclusive"

[applications]
minimum = 3
[[applications.entries]]
name = "literal-int"
entry = "literal-int"
