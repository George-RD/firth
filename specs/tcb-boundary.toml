schema = "firth.tcb-boundary"
version = 1
source_spec = "specs/component-spec-boundaries.md"
source_decision = "meta/decisions/tcb-boundary-inventory.md"

required_component_ids = [
  "firth.language.kernel",
  "firth.language.surface",
  "firth.language.types",
  "firth.toolchain.elaborator",
  "firth.toolchain.elaborator.translator",
  "firth.toolchain.elaborator.cache",
  "firth.toolchain.interpreter",
  "firth.toolchain.compiler",
  "firth.toolchain.compiler.translator",
  "firth.toolchain.diffharness",
  "firth.toolchain.smt",
  "firth.toolchain.smt.translator",
  "firth.toolchain.agent",
  "firth.toolchain.agent.diagnostic",
  "firth.runtime.vm",
  "firth.runtime.image",
  "firth.runtime.patch",
  "firth.ecosystem.stdlib",
  "firth.ecosystem.lsp",
  "firth.ecosystem.specs",
  "firth.governance.loop",
]

[[trusted_components]]
id = "lean-kernel"
name = "Lean kernel"
condition = "The pinned Lean kernel checks every accepted theorem, definition, type, and proof term. No unproved escape hatch is accepted."

[[trusted_components]]
id = "smt-solver"
name = "Pinned SMT solver"
conditional = true
condition = "Included only for an approved profile when the pinned solver returns unsat, the input and result are content-addressed, the translation-soundness bridge is checked by Lean, and the record is regenerated and rechecked."
excluded_results = ["sat", "unknown", "timeout", "resource-exhausted", "malformed", "crashed", "unchecked-unsat", "unsupported", "translation-failure"]

[[trusted_components]]
id = "vm"
name = "Firth VM"
condition = "The VM is the trusted execution boundary. Its target contract, decoding, image, patch, and conformance evidence remain explicit."

[smt_policy]
required_terms = ["unsat", "pinned", "content-addressed", "Lean", "rechecked"]
accepted_result = "unsat"
solver_pinned = true
record_content_addressed = true
translation_soundness_checked_by = "lean-kernel"
record_rechecked = true
excluded_results = ["sat", "unknown", "timeout", "resource-exhausted", "malformed", "crashed", "unchecked-unsat", "unsupported", "translation-failure"]

[[components]]
id = "firth.language.kernel"
module = "firth.language.kernel"
category = "kernel-specification"
status = "implemented"
trusted = false
[[components.outputs]]
id = "kernel-definitions-and-metatheory"
accepted_by = ["lean-kernel"]
evidence = ["lean-zero-admit", "lean-build", "lean-test-driver"]

