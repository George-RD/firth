[[stages]]
id = "lean-zero-admit"
command = "python3 tools/loop/check_zero_admit.py"
trusted_components = ["lean-kernel"]
evidence_paths = ["tools/loop/check_zero_admit.py", "src"]

[[stages]]
id = "lean-build"
command = "lake build"
trusted_components = ["lean-kernel"]
evidence_paths = ["lakefile.toml", "lean-toolchain", "src"]

[[stages]]
id = "lean-test-driver"
command = "lake test"
trusted_components = ["lean-kernel"]
evidence_paths = ["lakefile.toml", "src/agent/FirthAllTest.lean"]

[[stages]]
id = "smt-boundary"
command = "lake exe smtBoundaryTest"
trusted_components = ["lean-kernel"]
evidence_paths = ["src/smt/Firth/SmtBoundary.lean", "src/smt/Firth/SmtBoundaryTest.lean"]

[[stages]]
id = "vm-conformance"
command = "cargo test --locked --manifest-path src/runtime/vm/Cargo.toml"
trusted_components = ["vm"]
evidence_paths = ["src/runtime/vm/Cargo.toml", "src/runtime/vm/src"]

[[stages]]
id = "vm-fixtures"
command = "tools/loop/check_kernel_fixtures.sh"
trusted_components = ["lean-kernel", "vm"]
evidence_paths = ["tools/loop/check_kernel_fixtures.sh", "src/runtime/vm/fixtures/kernel.tsv"]
