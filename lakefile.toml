name = "firth"
version = "0.1.0"
defaultTargets = ["Firth", "FirthProofs", "FirthProofTests", "firthProofRecords", "firthAxiomAudit", "firthTest", "firthParserTest", "firthCompilerTest", "firthElaborateTest", "firthErasureTest", "firthStackEffectTest", "firthRefinementTest", "firthRecordIntegrityTest", "firthAdapterIntegrationTest", "firthAgentDiagnosticTest", "firthPipelineTest", "firthNamesTest", "smtBoundaryTest", "smtSolverTest", "firthReferenceRunTest", "firthExportsTest", "firthExportLean", "inventoryHost", "firthAllTest"]
testDriver = "firthAllTest"

[[lean_lib]]
name = "Firth"
srcDir = "src/interpreter"
roots = ["Firth", "FirthReferenceRun", "FirthLogicTest"]

[[lean_lib]]
name = "FirthElaborator"
srcDir = "src"
roots = ["elaborator.Firth.Parser", "elaborator.Firth.Names", "elaborator.Firth.Erasure", "elaborator.Firth.StackEffect", "elaborator.Firth.Account", "smt.Firth.SmtBoundary", "smt.Firth.SmtSolver", "elaborator.Firth.Refinement", "elaborator.Firth.Pipeline", "elaborator.FirthElaborator"]

[[lean_lib]]
name = "FirthCompiler"
srcDir = "src"
roots = ["compiler.Firth.Digest", "compiler.Firth.Target", "compiler.Firth.WordType", "compiler.Firth.Lowering", "compiler.Firth.LoweringFacts", "compiler.Firth.LoweringMutants", "compiler.Firth.Compile", "compiler.Firth.ExportLean", "compiler.Firth.ProofRecords", "compiler.Firth.AxiomAudit"]

[[lean_lib]]
name = "FirthExports"
srcDir = "src"
globs = ["exports.+"]

[[lean_lib]]
name = "FirthProofs"
srcDir = "src"
globs = ["proofs.+"]

[[lean_lib]]
name = "FirthProofTests"
srcDir = "src"
globs = ["prooftests.+"]

[[lean_lib]]
name = "FirthAgent"
srcDir = "src"
roots = ["agent.Firth.Agent.DiagnosticEnvelope", "agent.Firth.Agent.JsonMembers", "agent.Firth.Agent.Validation", "agent.Firth.Agent.ElaboratorDiagnostics", "agent.Firth.Agent.ElaborateAdapter"]

[[lean_lib]]
name = "FirthAgentTests"
srcDir = "src"
roots = ["agent.Firth.Agent.DiagnosticEnvelopeTest", "agent.Firth.Agent.ValidationTest", "agent.Firth.Agent.ElaboratorDiagnosticsTest"]

[[lean_exe]]
name = "inventoryHost"
root = "proofs.Inventory.HostMain"
srcDir = "src"

[[lean_exe]]
name = "firthTest"
root = "FirthTest"
srcDir = "src/interpreter"

[[lean_exe]]
name = "firthParserTest"
root = "elaborator.FirthParserTest"
srcDir = "src"

