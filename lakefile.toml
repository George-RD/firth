name = "firth"
version = "0.1.0"
defaultTargets = ["firthTest", "firthParserTest", "firthCompilerTest", "firthErasureTest", "firthStackEffectTest", "firthRefinementTest", "firthAgentDiagnosticTest", "firthPipelineTest", "smtBoundaryTest", "firthReferenceRunTest", "firthAllTest"]
testDriver = "firthAllTest"

[[lean_lib]]
name = "Firth"
srcDir = "src/interpreter"
roots = ["Firth", "FirthReferenceRun"]

[[lean_lib]]
name = "FirthElaborator"
srcDir = "src"
roots = ["elaborator.Firth.Parser", "elaborator.Firth.Erasure", "elaborator.Firth.StackEffect", "smt.Firth.SmtBoundary", "elaborator.Firth.Refinement", "elaborator.Firth.Pipeline", "elaborator.FirthElaborator"]

[[lean_lib]]
name = "FirthCompiler"
srcDir = "src"
roots = ["compiler.Firth.Digest", "compiler.Firth.Target", "compiler.Firth.WordType", "compiler.Firth.Lowering", "compiler.Firth.Compile"]

[[lean_lib]]
name = "FirthAgent"
srcDir = "src"
roots = ["agent.Firth.Agent.DiagnosticEnvelope", "agent.Firth.Agent.JsonMembers", "agent.Firth.Agent.Validation", "agent.Firth.Agent.ElaboratorDiagnostics"]

[[lean_lib]]
name = "FirthAgentTests"
srcDir = "src"
roots = ["agent.Firth.Agent.DiagnosticEnvelopeTest", "agent.Firth.Agent.ValidationTest", "agent.Firth.Agent.ElaboratorDiagnosticsTest"]

[[lean_exe]]
name = "firthTest"
root = "FirthTest"
srcDir = "src/interpreter"

[[lean_exe]]
name = "firthParserTest"
root = "elaborator.FirthParserTest"
srcDir = "src"

[[lean_exe]]
name = "firth"
root = "elaborator.FirthPipelineCli"
srcDir = "src"

[[lean_exe]]
name = "firthPipelineTest"
root = "elaborator.FirthPipelineTest"
srcDir = "src"

[[lean_exe]]
name = "firthCompilerTest"
root = "compiler.FirthCompilerTest"
srcDir = "src"

[[lean_exe]]
name = "firthCompile"
root = "compiler.FirthCompileCli"
srcDir = "src"

[[lean_exe]]
name = "firthVmFixtures"
root = "FirthVmFixtures"
srcDir = "src/interpreter"

[[lean_exe]]
name = "firthErasureTest"
root = "elaborator.FirthErasureTest"
srcDir = "src"

[[lean_exe]]
name = "firthStackEffectTest"
root = "elaborator.FirthStackEffectTest"
srcDir = "src"

[[lean_exe]]
name = "firthRefinementTest"
root = "elaborator.FirthRefinementTest"
srcDir = "src"

[[lean_exe]]
name = "firthAgentDiagnosticTest"
root = "agent.FirthDiagnosticEnvelopeTest"
srcDir = "src"

[[lean_exe]]
name = "firthAllTest"
root = "agent.FirthAllTest"
srcDir = "src"

[[lean_exe]]
name = "smtBoundaryTest"
root = "smt.Firth.SmtBoundaryTest"
srcDir = "src"

[[lean_exe]]
name = "firthReferenceRun"
root = "FirthReferenceRunMain"
srcDir = "src/interpreter"

[[lean_exe]]
name = "firthReferenceRunTest"
root = "FirthReferenceRunTest"
srcDir = "src/interpreter"